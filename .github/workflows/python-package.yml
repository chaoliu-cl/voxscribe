name: VoxScribe Python Package CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
        exclude:
          # Optional: exclude certain combinations if needed
          - os: macos-latest
            python-version: '3.8'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Verify package structure
      run: |
        echo "=== Package Structure ==="
        ls -la
        echo ""
        echo "=== Python Files ==="
        find . -name "*.py" -type f | head -20
      shell: bash
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsndfile1 \
          ffmpeg \
          portaudio19-dev \
          python3-dev
    
    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install ffmpeg portaudio
    
    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install ffmpeg -y
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install pytest pytest-cov pytest-xdist pytest-timeout
        pip install flake8 black isort mypy
    
    - name: Install package dependencies
      run: |
        # Core dependencies
        pip install faster-whisper
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install soundfile pydub
        
        # GUI dependencies
        pip install PySide6
        
        # Analysis dependencies
        pip install numpy pandas matplotlib networkx
    
    - name: Add package to Python path
      run: |
        echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
      shell: bash
    
    - name: Install package in development mode
      run: |
        if [ -f "setup.py" ] || [ -f "pyproject.toml" ]; then
          pip install -e .
        else
          echo "No setup.py or pyproject.toml found, using PYTHONPATH"
        fi
      shell: bash
      continue-on-error: true
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
      continue-on-error: true
    
    - name: Check code formatting with black
      run: |
        black --check --diff .
      continue-on-error: true
    
    - name: Check import sorting with isort
      run: |
        isort --check-only --diff .
      continue-on-error: true
    
    - name: Type checking with mypy
      run: |
        mypy . --ignore-missing-imports --no-strict-optional
      continue-on-error: true
    
    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing --timeout=300
      continue-on-error: true
      if: hashFiles('tests/*.py') != ''
    
    - name: Test imports
      run: |
        cd ${{ github.workspace }}
        python -c "import sys; sys.path.insert(0, '.'); from transcriber import AudioTranscriber; print('✓ transcriber import OK')"
        python -c "import sys; sys.path.insert(0, '.'); from annotator import TextAnnotator; print('✓ annotator import OK')"
        python -c "import sys; sys.path.insert(0, '.'); from utils import format_time, validate_audio_file; print('✓ utils import OK')"
        python -c "print('✓ All core imports successful')"
      shell: bash
    
    - name: Test basic functionality
      run: |
        cd ${{ github.workspace }}
        python -c "
        import sys
        sys.path.insert(0, '.')
        
        from transcriber import AudioTranscriber
        from annotator import TextAnnotator
        from utils import format_time
        
        # Test utils
        assert format_time(65.5) == '01:05.500', 'format_time failed'
        print('✓ Utils functions work')
        
        # Test annotator
        annotator = TextAnnotator()
        annotator.load_segments([{'text': 'test', 'id': 0}])
        assert len(annotator.segments) == 1, 'Annotator failed'
        print('✓ TextAnnotator works')
        
        # Test transcriber initialization
        transcriber = AudioTranscriber(device='cpu', compute_type='int8')
        device_info = transcriber.get_device_info()
        assert 'device' in device_info, 'Transcriber initialization failed'
        print('✓ AudioTranscriber initialization works')
        
        print('✓ All basic functionality tests passed')
        "
      shell: bash
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
      continue-on-error: true
      if: hashFiles('coverage.xml') != ''
    
    - name: Build distribution
      run: |
        pip install build
        python -m build
      continue-on-error: true
    
    - name: Test installation from wheel
      run: |
        pip install dist/*.whl
      continue-on-error: true
      if: hashFiles('dist/*.whl') != ''

  test-gui:
    name: Test GUI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsndfile1 \
          ffmpeg \
          qt6-base-dev \
          libgl1-mesa-dev \
          libxkbcommon-x11-0 \
          libxcb-cursor0 \
          xvfb
    
    - name: Add package to Python path
      run: |
        echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
      shell: bash
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 pytest pytest-qt
        pip install faster-whisper torch soundfile pydub
        pip install numpy pandas matplotlib networkx
    
    - name: Test GUI imports (Linux with Xvfb)
      if: runner.os == 'Linux'
      run: |
        cd ${{ github.workspace }}
        xvfb-run python -c "
        import sys
        sys.path.insert(0, '.')
        from PySide6.QtWidgets import QApplication
        from gui import VoxScribeGUI
        app = QApplication(sys.argv)
        window = VoxScribeGUI()
        print('✓ GUI initialization successful')
        app.quit()
        "
      shell: bash
    
    - name: Test GUI imports (Windows/macOS)
      if: runner.os != 'Linux'
      run: |
        cd ${{ github.workspace }}
        python -c "
        import sys
        sys.path.insert(0, '.')
        from PySide6.QtWidgets import QApplication
        print('✓ PySide6 import successful')
        try:
            from gui import VoxScribeGUI
            print('✓ GUI module import successful')
        except Exception as e:
            print(f'! GUI initialization skipped (display not available): {e}')
        "
      continue-on-error: true
      shell: bash

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsndfile1 ffmpeg
    
    - name: Add package to Python path
      run: |
        echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
      shell: bash
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install faster-whisper torch soundfile pydub
        pip install numpy pandas matplotlib networkx PySide6
        pip install pytest pytest-timeout
    
    - name: Create test audio file
      run: |
        python -c "
        import numpy as np
        import soundfile as sf
        
        # Generate 3 seconds of sine wave (440 Hz)
        sample_rate = 16000
        duration = 3
        t = np.linspace(0, duration, int(sample_rate * duration))
        audio = np.sin(2 * np.pi * 440 * t) * 0.3
        
        sf.write('test_audio.wav', audio, sample_rate)
        print('✓ Test audio file created')
        "
    
    - name: Test transcription pipeline
      run: |
        cd ${{ github.workspace }}
        python -c "
        import sys
        sys.path.insert(0, '.')
        
        from transcriber import AudioTranscriber
        from annotator import TextAnnotator
        
        # Test transcription
        transcriber = AudioTranscriber(model_size='tiny', device='cpu', compute_type='int8')
        transcriber.load_model()
        print('✓ Model loaded')
        
        # Transcribe test audio
        results = transcriber.transcribe('test_audio.wav', language='en', include_timestamps=True)
        print(f'✓ Transcription complete: {len(results)} segments')
        
        # Test annotation
        annotator = TextAnnotator()
        annotator.load_segments(results)
        print(f'✓ Annotation loaded: {len(annotator.segments)} segments')
        
        # Test export
        annotator.export_to_txt('output.txt')
        print('✓ Export to TXT successful')
        
        annotator.export_to_json('output.json')
        print('✓ Export to JSON successful')
        
        print('✓ Full integration test passed')
        "
      timeout-minutes: 10
      shell: bash

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install security tools
      run: |
        pip install bandit safety
    
    - name: Run bandit security scan
      run: |
        bandit -r . -f json -o bandit-report.json
      continue-on-error: true
    
    - name: Run safety check
      run: |
        pip install -r requirements.txt || echo "No requirements.txt found"
        safety check --json
      continue-on-error: true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
      if: always()

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install documentation dependencies
      run: |
        pip install sphinx sphinx-rtd-theme
    
    - name: Build documentation
      run: |
        if [ -d "docs" ]; then
          cd docs
          make html
          echo "✓ Documentation built successfully"
        else
          echo "! No docs directory found, skipping"
        fi
      continue-on-error: true
