name: VoxScribe Python Package CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsndfile1 \
          ffmpeg \
          portaudio19-dev \
          libegl1 \
          libxkbcommon-x11-0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-xinerama0 \
          libxcb-xfixes0 \
          libxcb-shape0 \
          libglib2.0-0 \
          libgl1-mesa-glx \
          libdbus-1-3 \
          xvfb

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install ffmpeg portaudio

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install ffmpeg -y

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install flake8 pytest pytest-cov pytest-timeout
        
    - name: Install core dependencies
      run: |
        # Install compatible versions with fallback
        pip install "faster-whisper>=1.0.0,<1.2.0" || pip install "faster-whisper==1.1.0"
        pip install "numpy>=1.24.0,<2.0.0"
        pip install soundfile>=0.12.0
        pip install pydub>=0.25.1
        pip install PySide6>=6.5.0
        pip install pandas>=2.0.0
        pip install matplotlib>=3.7.0
        pip install networkx>=3.0
        
    - name: Install PyTorch (CPU-only for CI)
      run: |
        pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Install package
      run: |
        pip install -e .

    - name: Test imports
      run: |
        python -c "from voxscribe import AudioTranscriber, TextAnnotator"
        python -c "import voxscribe; print(f'VoxScribe version: {voxscribe.__version__}')"
        echo "Note: GUI import skipped in CI (requires display)"
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Run unit tests (if tests exist)
      if: hashFiles('tests/*.py') != ''
      run: |
        pytest tests/ -v --cov=voxscribe --cov-report=xml --cov-report=term --timeout=300
      continue-on-error: true

    - name: Test basic functionality
      run: |
        python -c "
        from voxscribe.transcriber import AudioTranscriber
        from voxscribe.annotator import TextAnnotator
        from voxscribe.utils import format_time, validate_audio_file
        
        # Test utility functions
        assert format_time(125.5) == '02:05.500'
        print('✓ format_time works')
        
        # Test AudioTranscriber initialization
        transcriber = AudioTranscriber(device='cpu', model_size='tiny')
        print('✓ AudioTranscriber initialized')
        
        # Test TextAnnotator
        annotator = TextAnnotator()
        test_segments = [
            {'id': 0, 'text': 'Hello world', 'start': 0.0, 'end': 1.0},
            {'id': 1, 'text': 'This is a test', 'start': 1.0, 'end': 3.0}
        ]
        annotator.load_segments(test_segments)
        print('✓ TextAnnotator works')
        
        print('All basic functionality tests passed!')
        "
    
    - name: Test GUI import (with virtual display on Linux)
      if: runner.os == 'Linux'
      run: |
        export QT_QPA_PLATFORM=offscreen
        xvfb-run -a python -c "
        try:
            from voxscribe.gui import VoxScribeGUI
            print('✓ GUI import successful with virtual display')
        except Exception as e:
            print(f'⚠ GUI import failed: {e}')
            print('This is expected in some CI environments')
        "
      continue-on-error: true
    
    - name: Test GUI import (non-Linux)
      if: runner.os != 'Linux'
      run: |
        python -c "
        try:
            from voxscribe.gui import VoxScribeGUI
            print('✓ GUI import successful')
        except Exception as e:
            print(f'⚠ GUI import failed: {e}')
            print('This is expected in headless environments')
        "
      continue-on-error: true

    - name: Check package build
      run: |
        pip install build
        python -m build

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    name: Build distribution packages
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package with twine
      run: twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  lint:
    name: Code quality checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint black isort mypy

    - name: Run flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Check code formatting with black
      run: |
        black --check --diff .
      continue-on-error: true

    - name: Check import ordering with isort
      run: |
        isort --check-only --diff .
      continue-on-error: true

    - name: Run pylint
      run: |
        pip install -r requirements.txt
        pylint voxscribe --exit-zero --max-line-length=127
      continue-on-error: true

  security:
    name: Security checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit

    - name: Check dependencies for vulnerabilities
      run: |
        pip install -r requirements.txt
        safety check --json
      continue-on-error: true

    - name: Run bandit security linter
      run: |
        bandit -r voxscribe -f json -o bandit-report.json
      continue-on-error: true

    - name: Upload bandit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bandit-security-report
        path: bandit-report.json

  docs:
    name: Documentation check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pydocstyle

    - name: Check docstring coverage
      run: |
        pydocstyle voxscribe --count
      continue-on-error: true
